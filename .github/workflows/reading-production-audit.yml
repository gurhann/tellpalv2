name: Reading Production Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Üretim kapasitesini ve açık hazırlık ayarlarını oku
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: 7cdc95be-e51d-44a0-9e47-14d4c3e989a1
        shell: python
        run: |
          import datetime
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          endpoint = "https://backboard.railway.com/graphql/v2"
          project_id = os.environ["RAILWAY_PROJECT_ID"]
          token = os.environ["RAILWAY_TOKEN"]
          auth = None

          def query(document, variables):
              global auth
              if not document.lstrip().startswith("query "):
                  raise SystemExit("Yalnız salt okunur sorgulara izin verilir")
              candidates = [auth] if auth else ["Project-Access-Token", "Authorization"]
              for header in candidates:
                  headers = {"Content-Type": "application/json", header: token if header != "Authorization" else "Bearer " + token}
                  request = urllib.request.Request(endpoint, headers=headers, method="POST",
                      data=json.dumps({"query": document, "variables": variables}).encode())
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          payload = json.load(response)
                  except urllib.error.HTTPError:
                      continue
                  if payload.get("errors"):
                      if auth:
                          raise SystemExit("Railway salt okunur sorgusu başarısız; gizli yanıt yazdırılmadı")
                      continue
                  auth = header
                  return payload["data"]
              raise SystemExit("Railway sorgusu yetkilendirilemedi; gizli yanıt yazdırılmadı")

          project = query("""query Project($id: String!) {
            project(id: $id) {
              services { edges { node { id name } } }
              environments { edges { node { id name } } }
            }
          }""", {"id": project_id})["project"]
          environments = [r["node"] for r in project["environments"]["edges"] if r["node"]["name"] == "production"]
          services = [r["node"] for r in project["services"]["edges"] if r["node"]["name"] in ("tellpal-be", "tellpal-cms")]
          if len(environments) != 1 or len(services) != 2:
              raise SystemExit("Beklenen üretim ortamı veya servisler tekil bulunamadı")
          environment_id = environments[0]["id"]
          report = {"project_id": project_id, "environment_id": environment_id, "services": {}}
          for service in services:
              params = {"serviceId": service["id"], "environmentId": environment_id}
              result = query("""query Limits($serviceId: String!, $environmentId: String!) {
                serviceInstanceLimits(serviceId: $serviceId, environmentId: $environmentId)
                serviceInstance(serviceId: $serviceId, environmentId: $environmentId) {
                  numReplicas latestDeployment { id status createdAt }
                }
              }""", params)
              report["services"][service["name"]] = {"service_id": service["id"], **result}
              if service["name"] != "tellpal-be":
                  continue
              variables = query("""query Variables($projectId: String!, $environmentId: String!, $serviceId: String) {
                variables(projectId: $projectId, environmentId: $environmentId, serviceId: $serviceId)
              }""", {"projectId": project_id, **params})["variables"]
              allowed = ("SPRING_PROFILES_ACTIVE", "TELLPAL_ASSET_STORAGE_FIREBASE_PATH_PREFIX",
                  "TELLPAL_ASSET_READING_PRODUCTION_ENABLED", "TELLPAL_ASSET_READING_PRODUCTION_CONTENT_ID",
                  "TELLPAL_ASSET_READING_PRODUCTION_LANGUAGE", "TELLPAL_ASSET_READING_PRODUCTION_MANUAL_ENABLED",
                  "TELLPAL_CONTENT_READING_PUBLICATION_ENABLED", "TELLPAL_CONTENT_READING_PUBLICATION_PRODUCTION_ENABLED")
              safe = {key: variables.get(key) for key in allowed}
              for key in ("JAVA_TOOL_OPTIONS", "JDK_JAVA_OPTIONS", "JAVA_OPTS"):
                  safe[key] = re.findall(r"-X(?:mx|ms)\d+[kKmMgG]?|-XX:(?:MaxRAMPercentage|InitialRAMPercentage)=\d+(?:\.\d+)?", variables.get(key) or "")
              safe["spring_application_json_present"] = bool(variables.get("SPRING_APPLICATION_JSON"))
              report["services"][service["name"]]["safe_settings"] = safe
          report["checked_at"] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          rendered = json.dumps(report, ensure_ascii=False, indent=2)
          print(rendered)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Salt okunur üretim kapasitesi\n\n```json\n" + rendered + "\n```\n")
