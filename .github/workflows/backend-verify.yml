name: Backend Verify

on:
  pull_request:
    paths:
      - "be/**"
      - ".github/workflows/backend-verify.yml"
  push:
    branches:
      - main
    paths:
      - "be/**"
      - ".github/workflows/backend-verify.yml"

jobs:
  backend-verify:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: be

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Python launcher testlerini çalıştır
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: Pinli native araçları aynı test job’ında kur
        env:
          NATIVE_TOOLS: ${{ runner.temp }}/tellpal-reading-native
        run: |
          sh tools/install-reading-webp.sh linux-x86-64 "$NATIVE_TOOLS/webp"
          sh tools/install-reading-supervisor.sh "$NATIVE_TOOLS/supervisor"
          echo "TELLPAL_READING_WEBP_TOOL_DIRECTORY=$NATIVE_TOOLS/webp" >> "$GITHUB_ENV"
          echo "TELLPAL_READING_SUPERVISOR_DIRECTORY=$NATIVE_TOOLS/supervisor" >> "$GITHUB_ENV"
          echo "TELLPAL_READING_NATIVE_TESTS_REQUIRED=true" >> "$GITHUB_ENV"

      - name: Run backend verify
        run: ./mvnw verify
