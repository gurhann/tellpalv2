plugins {
    id 'com.android.application'
    id 'dev.flutter.flutter-gradle-plugin'
}
android {
    namespace 'com.tellpal.p5d'
    compileSdk 36
    defaultConfig {
        applicationId 'com.tellpal.p5d.offline'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0'
        testApplicationId 'com.tellpal.p5d.offline.test'
        testInstrumentationRunner 'com.tellpal.p5d.P5dInstrumentation'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testBuildType 'release'
    signingConfigs {
        existingQa {
            storeFile file(providers.gradleProperty('p5dExistingKeystore').get())
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.existingQa
            minifyEnabled false
            shrinkResources false
        }
    }
}
flutter { source '../..' }
